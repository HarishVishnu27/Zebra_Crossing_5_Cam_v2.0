<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Zebra Crossing Analytics v2</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4c1d95 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Animated floating shapes */
        .floating-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: float 20s infinite ease-in-out;
        }
        .shape:nth-child(1) {
            width: 300px; height: 300px;
            background: #818cf8;
            top: -80px; left: -60px;
            animation-duration: 18s;
        }
        .shape:nth-child(2) {
            width: 200px; height: 200px;
            background: #a78bfa;
            bottom: -50px; right: -40px;
            animation-duration: 22s;
            animation-delay: -5s;
        }
        .shape:nth-child(3) {
            width: 150px; height: 150px;
            background: #c084fc;
            top: 40%; left: 70%;
            animation-duration: 25s;
            animation-delay: -10s;
        }
        .shape:nth-child(4) {
            width: 100px; height: 100px;
            background: #e879f9;
            top: 60%; left: 10%;
            animation-duration: 16s;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(30px, -40px) scale(1.1); }
            50%      { transform: translate(-20px, 20px) scale(0.95); }
            75%      { transform: translate(15px, 35px) scale(1.05); }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.625rem;
            color: #e2e8f0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-field::placeholder { color: #94a3b8; }
        .input-field:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 0.625rem;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }
        .btn-login:active { transform: translateY(0); }

        /* Shake animation on error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-10px); }
            40%      { transform: translateX(10px); }
            60%      { transform: translateX(-6px); }
            80%      { transform: translateX(6px); }
        }
        .shake { animation: shake 0.5s ease-in-out; }
    </style>
</head>
<body>
    <!-- Floating background shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Login card -->
    <div class="glass-card w-full max-w-md mx-4 p-8 relative z-10 {% if error %}shake{% endif %}">
        <!-- Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500 bg-opacity-20 mb-4">
                <i class="fas fa-traffic-light text-3xl text-indigo-300"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Zebra Crossing Analytics v2</h1>
            <p class="text-indigo-300 text-sm mt-1">Vehicle Monitoring System</p>
        </div>

        <!-- Error message -->
        {% if error %}
        <div class="flex items-center gap-2 bg-red-500 bg-opacity-15 border border-red-500 border-opacity-30 text-red-300 text-sm rounded-lg px-4 py-3 mb-6">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login form -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-indigo-200 text-sm font-medium mb-2">
                    <i class="fas fa-user mr-1"></i> Username
                </label>
                <input type="text" id="username" name="username" required autofocus
                       class="input-field w-full px-4 py-3 text-sm"
                       placeholder="Enter your username">
            </div>
            <div>
                <label for="password" class="block text-indigo-200 text-sm font-medium mb-2">
                    <i class="fas fa-lock mr-1"></i> Password
                </label>
                <input type="password" id="password" name="password" required
                       class="input-field w-full px-4 py-3 text-sm"
                       placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login w-full py-3 text-sm mt-2">
                <i class="fas fa-sign-in-alt mr-2"></i>Sign In
            </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-indigo-400 text-xs mt-8 opacity-60">
            &copy; 2025 Zebra Crossing Analytics. All rights reserved.
        </p>
    </div>
</body>
</html>
